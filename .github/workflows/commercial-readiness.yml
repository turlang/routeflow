name: RouteFlow Commercial Readiness
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Validate Prisma
        working-directory: server
        env:
          DATABASE_URL: postgresql://routeflow:routeflow@localhost:5432/routeflow
        run: npx prisma validate
      - name: Generate Prisma client
        working-directory: server
        env:
          DATABASE_URL: postgresql://routeflow:routeflow@localhost:5432/routeflow
        run: npx prisma generate
      - name: Check JavaScript syntax
        run: |
          for file in server/src/*.js; do node --check "$file"; done
          node --check sw.js
          for file in src/*.js; do node --check "$file"; done
      - name: Run backend unit tests
        working-directory: server
        run: node --test
      - name: Validate release artifacts
        run: |
          test -f manifest.webmanifest
          test -f PRIVACY.md
          test -f TERMS.md
          test -f DEVELOPMENT_STATE.md
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
