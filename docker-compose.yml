services:
  postgres:
    image: postgres:17-alpine
    container_name: routeflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: routeflow
      POSTGRES_USER: routeflow
      POSTGRES_PASSWORD: routeflow_dev
    ports:
      - "55432:5432"
    volumes:
      - routeflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeflow -d routeflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: routeflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://routeflow:routeflow_dev@postgres:5432/routeflow?schema=public
      JWT_SECRET: routeflow-local-dev-secret-change-before-production
      CORS_ORIGIN: http://127.0.0.1:5500,http://localhost:5500,https://turlang.github.io
    ports:
      - "3001:3001"

volumes:
  routeflow_postgres_data:
